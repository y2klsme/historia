<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역사 모둠 퀴즈 도구</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* 부드러운 전환 효과 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

    <!-- ========================================== -->
    <!-- [선생님 설정 영역] 문제 및 모둠을 여기서 수정하세요 -->
    <!-- ========================================== -->
    <script>
        const CONFIG = {
            quizTitle: "중학교 2학년 역사 복습 퀴즈",
            // 모둠 이름 설정 (원하는 만큼 수정 가능)
            groups: ["1모둠", "2모둠", "3모둠", "4모둠", "5모둠"],
            // 문제와 정답 설정
            questions: [
                {
                    question: "조선 건국 이후 태조 이성계가 도읍을 옮긴 곳의 명칭은 무엇인가요?",
                    answer: "한양"
                },
                {
                    question: "세종 대에 발명된, 비가 내린 양을 측정하는 과학 기구의 이름은 무엇인가요?",
                    answer: "측우기"
                },
                {
                    question: "임진왜란 당시 이순신 장군이 첫 승리를 거둔 해전은 어디인가요?",
                    answer: "옥포 해전"
                },
                {
                    question: "실학을 집대성하고 『목민심서』, 『경세유표』 등을 저술한 조선 후기의 학자는 누구인가요?",
                    answer: "정약용"
                },
                {
                    question: "고종의 아버지로 대원군에 임명되어 쇄국정책을 펼치며 서원 철폐 등을 단행한 인물은?",
                    answer: "흥선대원군 (이하응)"
                }
            ]
        };
    </script>

    <!-- 상단 헤더 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-col sm:flex-row justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <span class="bg-amber-500 text-slate-950 font-ext500 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-bold">HISTORY QUIZ</span>
            <h1 id="header-title" class="text-xl sm:text-2xl font-bold text-white">역사 퀴즈 도구</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span id="question-counter" class="text-slate-400 text-sm font-medium">문제 1 / 5</span>
            <button onclick="resetAllScores()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-3 py-1.5 rounded-lg transition active:scale-95">점수 초기화</button>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6 justify-center">

        <!-- 문제 카드 -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-10 shadow-xl flex flex-col items-center text-center relative fade-in" id="quiz-card">
            <div class="absolute top-4 left-4 bg-slate-700/60 text-amber-400 text-xs sm:text-sm font-semibold px-3 py-1 rounded-full" id="question-badge">
                QUESTION 1
            </div>
            
            <!-- 문제 내용 -->
            <div class="my-8 sm:my-12">
                <p id="question-text" class="text-2xl sm:text-4xl font-bold leading-relaxed text-slate-100 max-w-3xl">
                    문제를 불러오는 중입니다...
                </p>
            </div>

            <!-- 정답 보기 버튼 및 영역 -->
            <div class="w-full flex flex-col items-center border-t border-slate-700/60 pt-6">
                <button onclick="toggleAnswer()" id="answer-btn" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition duration-200 text-base sm:text-lg flex items-center space-x-2 active:scale-95">
                    <span>정답 보기</span>
                </button>
                
                <div id="answer-container" class="hidden mt-4 p-4 bg-slate-900/80 border border-amber-500/50 rounded-xl text-amber-300 font-bold text-xl sm:text-2xl w-full max-w-xl fade-in">
                    <span class="text-xs text-slate-400 block mb-1 font-normal">정답</span>
                    <span id="answer-text">정답 내용</span>
                </div>
            </div>
        </div>

        <!-- 문제 이전 / 다음 내비게이션 -->
        <div class="flex justify-between items-center px-2">
            <button onclick="prevQuestion()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-5 py-3 rounded-xl border border-slate-700 transition flex items-center space-x-2 active:scale-95 text-sm sm:text-base">
                <span>◀ 이전 문제</span>
            </button>
            <div class="flex space-x-2" id="pagination-dots">
                <!-- 동적으로 생성될 페이지네이션 도트 -->
            </div>
            <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition flex items-center space-x-2 active:scale-95 text-sm sm:text-base">
                <span>다음 문제 ▶</span>
            </button>
        </div>

        <!-- 모둠별 점수판 영역 -->
        <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-lg mt-2">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 text-center sm:text-left">모둠별 점수 현황</h2>
            <div id="score-board" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 sm:gap-4">
                <!-- 모둠 점수 카드가 동적으로 생성됨 -->
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="text-center py-4 text-slate-500 text-xs border-t border-slate-800">
        역사 수업 모둠 퀴즈 도구 &bull; 서버 없이 브라우저에서 안전하게 작동합니다.
    </footer>

    <!-- 애플리케이션 로직 -->
    <script>
        // 상태 관리 변수
        let currentIdx = 0;
        let isAnswerShown = false;
        let scores = {};

        // 초기화 실행
        function initApp() {
            // 헤더 제목 반영
            document.getElementById('header-title').innerText = CONFIG.quizTitle;
            document.title = CONFIG.quizTitle;

            // 점수 초기화 (로컬 스토리지 연동 또는 기본 0점)
            const savedScores = localStorage.getItem('history_quiz_scores');
            if (savedScores) {
                try {
                    scores = JSON.parse(savedScores);
                } catch (e) {
                    initDefaultScores();
                }
            } else {
                initDefaultScores();
            }

            renderQuestion();
            renderScoreBoard();
            renderDots();
        }

        function initDefaultScores() {
            scores = {};
            CONFIG.groups.forEach(group => {
                scores[group] = 0;
            });
            saveScores();
        }

        function saveScores() {
            localStorage.setItem('history_quiz_scores', JSON.stringify(scores));
        }

        // 문제 렌더링
        function renderQuestion() {
            const q = CONFIG.questions[currentIdx];
            document.getElementById('question-badge').innerText = `QUESTION ${currentIdx + 1} / ${CONFIG.questions.length}`;
            document.getElementById('question-counter').innerText = `문제 ${currentIdx + 1} / ${CONFIG.questions.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('answer-text').innerText = q.answer;
            
            // 정답 숨기기 상태로 초기화
            isAnswerShown = false;
            document.getElementById('answer-container').classList.add('hidden');
            document.getElementById('answer-btn').innerHTML = '<span>정답 보기</span>';
            
            updateDots();
        }

        // 정답 토글
        function toggleAnswer() {
            isAnswerShown = !isAnswerShown;
            const container = document.getElementById('answer-container');
            const btn = document.getElementById('answer-btn');

            if (isAnswerShown) {
                container.classList.remove('hidden');
                btn.innerHTML = '<span>정답 숨기기</span>';
                btn.className = "bg-slate-700 hover:bg-slate-600 text-amber-300 font-bold px-6 py-3 rounded-xl shadow-lg transition duration-200 text-base sm:text-lg flex items-center space-x-2 active:scale-95";
            } else {
                container.classList.add('hidden');
                btn.innerHTML = '<span>정답 보기</span>';
                btn.className = "bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition duration-200 text-base sm:text-lg flex items-center space-x-2 active:scale-95";
            }
        }

        // 이전/다음 문제 이동
        function nextQuestion() {
            if (currentIdx < CONFIG.questions.length - 1) {
                currentIdx++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                renderQuestion();
            }
        }

        function goToQuestion(idx) {
            currentIdx = idx;
            renderQuestion();
        }

        // 페이지네이션 도트 생성
        function renderDots() {
            const container = document.getElementById('pagination-dots');
            container.innerHTML = '';
            CONFIG.questions.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-200 ${idx === currentIdx ? 'bg-indigo-500 w-6' : 'bg-slate-700 hover:bg-slate-600'}`;
                dot.onclick = () => goToQuestion(idx);
                container.appendChild(dot);
            });
        }

        function updateDots() {
            const dots = document.getElementById('pagination-dots').children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentIdx) {
                    dots[i].className = 'w-6 h-3 rounded-full bg-indigo-500 transition-all duration-200';
                } else {
                    dots[i].className = 'w-3 h-3 rounded-full bg-slate-700 hover:bg-slate-600 transition-all duration-200';
                }
            }
        }

        // 점수 변경 (+/-)
        function changeScore(group, delta) {
            if (scores[group] !== undefined) {
                scores[group] = Math.max(0, scores[group] + delta);
                saveScores();
                renderScoreBoard();
            }
        }

        // 점수판 렌더링
        function renderScoreBoard() {
            const board = document.getElementById('score-board');
            board.innerHTML = '';

            CONFIG.groups.forEach(group => {
                const score = scores[group] !== undefined ? scores[group] : 0;
                
                const card = document.createElement('div');
                card.className = "bg-slate-900/70 border border-slate-700/80 rounded-xl p-3 sm:p-4 flex flex-col items-center justify-between shadow transition hover:border-slate-600";
                
                card.innerHTML = `
                    <div class="text-sm sm:text-base font-bold text-slate-300 mb-2">${group}</div>
                    <div class="text-3xl sm:text-4xl font-black text-amber-400 my-1">${score}</div>
                    <div class="flex space-x-2 w-full mt-2">
                        <button onclick="changeScore('${group}', -1)" class="flex-1 bg-slate-800 hover:bg-rose-900/60 text-rose-300 font-bold py-2 rounded-lg text-sm border border-slate-700 transition active:scale-95">-</button>
                        <button onclick="changeScore('${group}', 1)" class="flex-1 bg-slate-800 hover:bg-emerald-900/60 text-emerald-300 font-bold py-2 rounded-lg text-sm border border-slate-700 transition active:scale-95">+</button>
                    </div>
                `;
                board.appendChild(card);
            });
        }

        // 전체 점수 초기화
        function resetAllScores() {
            initDefaultScores();
            renderScoreBoard();
        }

        // 페이지 로드 시 실행
        window.onload = initApp;
    </script>
</body>
</html>
